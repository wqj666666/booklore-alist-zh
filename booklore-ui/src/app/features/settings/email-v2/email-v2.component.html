<div class="w-full h-[calc(100dvh-10.5rem)] md:h-[calc(100dvh-11.65rem)] overflow-y-auto border rounded-lg p-4 enclosing-container">
  <div class="settings-header">
    <h2 class="settings-title">
      <i class="pi pi-envelope"></i>
      {{ 'settings.emailV2.title' | translate }}
      <app-external-doc-link docType="email"></app-external-doc-link>
    </h2>
    <p class="settings-description">
      {{ 'settings.emailV2.description' | translate }}
    </p>
  </div>

  @if (hasPermission) {
    <div class="pb-8">
      <app-email-v2-provider></app-email-v2-provider>
    </div>
    <p-divider></p-divider>
    <div class="pt-4">
      <app-email-v2-recipient></app-email-v2-recipient>
    </div>
  } @else {
    <div class="access-denied-card">
      <i class="pi pi-lock"></i>
      <div class="access-denied-content">
        <h3>{{ 'settings.emailV2.accessDenied.title' | translate }}</h3>
        <p>
          {{ 'settings.emailV2.accessDenied.line1' | translate }}
          <br>
          {{ 'settings.emailV2.accessDenied.line2' | translate }}
        </p>
      </div>
    </div>
  }
</div>
