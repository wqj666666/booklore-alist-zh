<div class="pdf-preferences-container">
  <div class="setting-item">
    <div class="setting-info">
      <div class="setting-label-row">
        <label class="setting-label">{{ 'settings.readerPreferences.pdf.field.pageSpread.label' | translate }}</label>
        <div class="button-group">
          @for (spread of spreads; track spread) {
            <button
              type="button"
              class="option-button"
              [class.selected]="selectedSpread === spread.key"
              (click)="selectedSpread = spread.key"
              [pTooltip]="spread.name | translate"
              tooltipPosition="bottom">
              <i [class]="spread.icon"></i>
              <span class="option-text">{{ spread.name | translate }}</span>
            </button>
          }
        </div>
      </div>
      <p class="setting-description">
        {{ 'settings.readerPreferences.pdf.field.pageSpread.description' | translate }}
      </p>
    </div>
  </div>

  <div class="setting-item">
    <div class="setting-info">
      <div class="setting-label-row">
        <label class="setting-label">{{ 'settings.readerPreferences.pdf.field.pageZoom.label' | translate }}</label>
        <div class="button-group">
          @for (zoom of zooms; track zoom) {
            <button
              type="button"
              class="option-button"
              [class.selected]="selectedZoom === zoom.key"
              (click)="selectedZoom = zoom.key"
              [pTooltip]="zoom.name | translate"
              tooltipPosition="bottom">
              <i [class]="zoom.icon"></i>
              <span class="option-text">{{ zoom.name | translate }}</span>
            </button>
          }
        </div>
      </div>
      <p class="setting-description">
        {{ 'settings.readerPreferences.pdf.field.pageZoom.description' | translate }}
      </p>
    </div>
  </div>
</div>
