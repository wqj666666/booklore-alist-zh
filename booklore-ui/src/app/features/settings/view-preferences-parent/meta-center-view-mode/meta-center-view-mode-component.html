<div class="main-container enclosing-container">
  <div class="settings-header">
    <h2 class="settings-title">
      <i class="pi pi-cog"></i>
      {{ 'settings.metaCenterViewMode.title' | translate }}
    </h2>
    <p class="settings-description">
      {{ 'settings.metaCenterViewMode.description' | translate }}
    </p>
  </div>

  <div class="settings-content">
    <div class="preferences-section">
      <div class="settings-card">
        <div class="setting-item">
          <div class="setting-info">
            <div class="setting-label-row">
              <label class="setting-label">
                {{ 'settings.metaCenterViewMode.label.metadataCenterDisplayMode' | translate }}
                <i class="pi pi-info-circle text-sky-600"
                   [pTooltip]="'settings.metaCenterViewMode.tooltip.metadataCenterDisplayMode' | translate"
                   tooltipPosition="right"
                   style="cursor: pointer;">
                </i>
              </label>
              <div class="button-group">
                <button
                  type="button"
                  class="option-button"
                  [class.selected]="viewMode === 'route'"
                  (click)="onViewModeChange('route')">
                  <i class="pi pi-window-maximize"></i>
                  <span class="option-text">{{ 'settings.metaCenterViewMode.button.openInPage' | translate }}</span>
                </button>
                <button
                  type="button"
                  class="option-button"
                  [class.selected]="viewMode === 'dialog'"
                  (click)="onViewModeChange('dialog')">
                  <i class="pi pi-external-link"></i>
                  <span class="option-text">{{ 'settings.metaCenterViewMode.button.openInDialog' | translate }}</span>
                </button>
              </div>
            </div>
            <p class="setting-description">
              {{ 'settings.metaCenterViewMode.description.metadataCenterDisplayMode' | translate }}
            </p>
          </div>
        </div>
        <!-- Series View Mode Setting -->
        <div class="setting-item">
          <div class="setting-info">
            <div class="setting-label-row">
              <label class="setting-label">
                {{ 'settings.metaCenterViewMode.label.seriesViewMode' | translate }}
                <i class="pi pi-info-circle text-sky-600"
                   [pTooltip]="'settings.metaCenterViewMode.tooltip.seriesViewMode' | translate"
                   tooltipPosition="right"
                   style="cursor: pointer;">
                </i>
              </label>
              <div class="button-group">
                <button
                  type="button"
                  class="option-button"
                  [class.selected]="seriesViewMode === true"
                  (click)="onSeriesViewModeChange(true)">
                  <i class="pi pi-check-circle"></i>
                  <span class="option-text">{{ 'settings.metaCenterViewMode.button.enabled' | translate }}</span>
                </button>
                <button
                  type="button"
                  class="option-button"
                  [class.selected]="seriesViewMode === false"
                  (click)="onSeriesViewModeChange(false)">
                  <i class="pi pi-times-circle"></i>
                  <span class="option-text">{{ 'settings.metaCenterViewMode.button.disabled' | translate }}</span>
                </button>
              </div>
            </div>
            <p class="setting-description">
              {{ 'settings.metaCenterViewMode.description.seriesViewMode' | translate }}
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
