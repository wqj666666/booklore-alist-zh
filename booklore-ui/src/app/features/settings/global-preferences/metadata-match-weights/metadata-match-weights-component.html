<div class="flex pb-8">
  <p class="text-lg flex items-center gap-2">
    {{ 'settings.metadataMatchWeights.recalculate.title' | translate }}
    <i
      class="pi pi-info-circle text-blue-500"
      [pTooltip]="'settings.metadataMatchWeights.tooltip.recalculateInfo' | translate"
      tooltipPosition="right"
      style="cursor: help;"
    ></i>
  </p>

  <p-button
    class="pl-4"
    type="button"
    icon="pi pi-refresh"
    [label]="'settings.metadataMatchWeights.recalculate.action' | translate"
    [disabled]="isRecalculating"
    (click)="recalculate()"
    outlined
  ></p-button>
</div>


<p class="text-lg flex items-center gap-2">
  {{ 'settings.metadataMatchWeights.weights.title' | translate }}
  <i
    class="pi pi-info-circle text-blue-500"
    [pTooltip]="'settings.metadataMatchWeights.tooltip.adjustWeightsInfo' | translate"
    tooltipPosition="right"
    style="cursor: help;"
  ></i>
</p>

<div class="flex flex-col space-y-6 p-4">
  <div class="p-4 space-y-4 max-w-4xl custom-border">
    <form [formGroup]="form">
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-y-4 gap-x-6">
        @for (key of orderedKeys; track key) {
          <div class="flex text-sm items-center gap-2">
            <label class="capitalize w-full max-w-[150px]">
              {{ labelMap[key] | translate }}
            </label>
            <p-inputNumber
              [formControlName]="key"
              [min]="0"
              [max]="10"
              fluid
              [showButtons]="true"
            />
          </div>
        }
      </div>
      <div class="mt-4 flex justify-end">
        <p-button
          type="button"
          severity="success"
          [label]="'settings.metadataMatchWeights.weights.action.save' | translate"
          icon="pi pi-save"
          outlined
          [disabled]="isSaving"
          (click)="save()">
        </p-button>
      </div>
    </form>
  </div>
</div>
