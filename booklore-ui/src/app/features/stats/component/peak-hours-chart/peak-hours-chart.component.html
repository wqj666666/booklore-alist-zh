<div class="peak-hours-container">
  <div class="chart-header">
    <div class="chart-title">
      <h3>
        <i class="pi pi-clock peak-hours-icon"></i>
        {{ 'stats.user.peakHours.title' | translate }}
      </h3>
      <p class="chart-description">{{ 'stats.user.peakHours.subtitle' | translate }}</p>
    </div>
    <div class="filter-controls">
      <p-select
        [options]="yearOptions"
        [(ngModel)]="selectedYear"
        (onChange)="onFilterChange()"
        optionLabel="label"
        optionValue="value"
        [placeholder]="'stats.user.peakHours.filters.selectYear' | translate"
        [style]="{'min-width': '100px'}">
      </p-select>
      <p-select
        [options]="monthOptions"
        [(ngModel)]="selectedMonth"
        (onChange)="onFilterChange()"
        optionLabel="label"
        optionValue="value"
        [placeholder]="'stats.user.peakHours.filters.selectMonth' | translate"
        [style]="{'min-width': '130px'}">
      </p-select>
    </div>
  </div>
  <div class="chart-wrapper">
    <canvas baseChart
            [data]="(chartData$ | async) ?? {labels: [], datasets: []}"
            [options]="chartOptions"
            [type]="chartType">
    </canvas>
  </div>
</div>
