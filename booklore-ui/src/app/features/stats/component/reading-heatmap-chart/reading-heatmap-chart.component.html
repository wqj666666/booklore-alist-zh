<div class="reading-heatmap-container">
  <div class="chart-header">
    <div class="chart-title">
      <h3>
        <i class="pi pi-calendar reading-heatmap-icon"></i>
        {{ 'stats.user.readingHeatmap.title' | translate }}
      </h3>
      <p class="chart-description">{{ 'stats.user.readingHeatmap.subtitle' | translate }}</p>
    </div>
  </div>
  <div class="chart-wrapper">
    <canvas baseChart
            [data]="(chartData$ | async) ?? {labels: [], datasets: []}"
            [options]="chartOptions"
            [type]="chartType">
    </canvas>
  </div>
</div>
