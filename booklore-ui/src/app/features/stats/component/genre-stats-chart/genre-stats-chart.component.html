<div class="genre-stats-container">
  <div class="chart-header">
    <div class="chart-title">
      <h3>
        <i class="pi pi-chart-bar genre-title-icon"></i>
        {{ 'stats.user.genre.title' | translate }}
      </h3>
      <p class="chart-description">{{ 'stats.user.genre.subtitle' | translate }}</p>
    </div>
  </div>
  <div class="chart-wrapper">
    <canvas baseChart
            [data]="(chartData$ | async) ?? {labels: [], datasets: []}"
            [options]="chartOptions"
            [type]="chartType">
    </canvas>
  </div>
</div>
