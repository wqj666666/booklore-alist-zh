<div class="favorite-days-container">
  <div class="chart-header">
    <div class="chart-title">
      <h3>
        <i class="pi pi-calendar-plus favorite-days-icon"></i>
        {{ 'stats.user.favoriteDays.title' | translate }}
      </h3>
      <p class="chart-description">{{ 'stats.user.favoriteDays.subtitle' | translate }}</p>
    </div>
    <div class="filter-controls">
      <p-select
        [options]="yearOptions"
        [(ngModel)]="selectedYear"
        (onChange)="onFilterChange()"
        optionLabel="label"
        optionValue="value"
        [placeholder]="'stats.user.favoriteDays.filters.selectYear' | translate"
        [style]="{'min-width': '90px'}">
      </p-select>
      <p-select
        [options]="monthOptions"
        [(ngModel)]="selectedMonth"
        (onChange)="onFilterChange()"
        optionLabel="label"
        optionValue="value"
        [placeholder]="'stats.user.favoriteDays.filters.selectMonth' | translate"
        [style]="{'min-width': '120px'}">
      </p-select>
    </div>
  </div>
  <div class="chart-wrapper">
    <canvas baseChart
            [data]="(chartData$ | async) ?? {labels: [], datasets: []}"
            [options]="chartOptions"
            [type]="chartType">
    </canvas>
  </div>
</div>
