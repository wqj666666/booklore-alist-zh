<div class="staging-border p-4 rounded">
  <div class="flex justify-between items-center">

    <div class="flex flex-col justify-center">
      <p class="text font-bold text-zinc-300">{{ 'bookdrop.widget.pendingTitle' | translate }}</p>
      <p class="text-lg font-bold text-primary">{{ pendingCount }}</p>
      @if (lastUpdatedAt) {
        <p class="text-xs text-zinc-400 mt-1">
          {{ 'bookdrop.widget.lastUpdatedAt' | translate:{ date: (lastUpdatedAt | date: 'short') } }}
        </p>
      }
    </div>

    <div class="flex items-center">
      <p-button
        size="small"
        outlined
        severity="info"
        (click)="openReviewDialog()">
        {{ 'bookdrop.widget.reviewButton' | translate }}
      </p-button>
    </div>
  </div>
</div>
